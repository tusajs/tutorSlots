name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    name: C++ core (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core-cpp -B build
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  kotlin:
    name: Kotlin app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build jar
        working-directory: app-kotlin
        run: |
          chmod +x gradlew
          ./gradlew test fatJar --no-daemon

  compare:
    name: C++ vs Kotlin reports
    needs: [cpp, kotlin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both
        run: |
          cmake -S core-cpp -B build -DTUTOR_BUILD_TESTS=OFF
          cmake --build build
          (cd app-kotlin && chmod +x gradlew && ./gradlew fatJar --no-daemon)
      - name: Compare all offsets
        run: |
          diffs=0
          for m in $(seq -720 15 840); do
            a=$(( m < 0 ? -m : m )); s=$([ $m -lt 0 ] && echo - || echo +)
            off=$(printf "%s%02d:%02d" $s $((a / 60)) $((a % 60)))
            ./build/tutor_slots samples/snapshot.tsv --offset $off > cpp.txt
            java -jar app-kotlin/build/libs/tutor-slots-1.0-all.jar report samples/snapshot.tsv --offset $off > kt.txt
            cmp -s cpp.txt kt.txt || { echo "DIFF $off"; diffs=$((diffs + 1)); }
          done
          echo "differences: $diffs"
          test $diffs -eq 0
